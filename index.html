<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Neural Digit Recognizer | Interactive MNIST Classifier</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(18, 22, 41, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.4);
            --secondary: #9d4edd;
            --secondary-glow: rgba(157, 78, 221, 0.4);
            --accent: #4facfe;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* App Container */
        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 24px 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header Navigation */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px var(--primary-glow); }
            100% { box-shadow: 0 0 30px var(--secondary-glow); }
        }

        .brand-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .brand-title p {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .header-badges {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-status {
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
        }

        .badge-status.offline {
            color: var(--warning);
            border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* Banner Instructions */
        .instruction-banner {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.1), rgba(157, 78, 221, 0.12));
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .instruction-text {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .instruction-text i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .mouse-hint {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            flex-shrink: 0;
        }

        .hint-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            color: var(--text-main);
            white-space: nowrap;
        }

        /* Main Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 992px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards Style */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .card-title i {
            color: var(--primary);
        }

        /* Studio / Canvas Zone */
        .studio-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .canvas-header-title {
            text-align: center;
            margin-bottom: 2px;
        }

        .canvas-header-title h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff 0%, #38bdf8 50%, #00e5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .canvas-subtitle {
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 3px;
        }

        .canvas-frame {
            position: relative;
            padding: 0;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            width: 320px;
            height: 320px;
            transition: all 0.3s ease;
        }

        .canvas-frame.paper-theme {
            background: #ffffff;
            border-color: #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: calc(100% / 28) calc(100% / 28);
            z-index: 2;
        }

        .canvas-cursor {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 3;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3), inset 0 0 4px rgba(255, 255, 255, 0.2);
            transition: width 0.08s ease, height 0.08s ease;
        }

        #canvas {
            border-radius: 18px;
            cursor: none;
            display: block;
            touch-action: none;
        }

        .btn-reset {
            width: 320px;
            padding: 13px 24px;
            background: linear-gradient(90deg, #38bdf8 0%, #00e5ff 100%);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.6);
            background: linear-gradient(90deg, #00e5ff 0%, #38bdf8 100%);
        }

        .btn-reset:active {
            transform: translateY(1px);
            box-shadow: 0 3px 12px rgba(0, 229, 255, 0.3);
        }

        /* Tool Controls */
        .tools-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-tool {
            padding: 9px 15px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-tool.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary-action {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-weight: 700;
            border: none;
            padding: 10px 22px;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-primary-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--secondary-glow);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: var(--danger);
            color: #fff;
        }

        /* Brush Controls */
        .brush-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .brush-slider {
            width: 85px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Toggle switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* Preset Digit Buttons */
        .preset-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        .btn-preset {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            padding: 8px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-preset:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Analytics / Result Zone */
        .analytics-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top Spotlight */
        .spotlight-card {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(157, 78, 221, 0.15));
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .spotlight-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .digit-display {
            display: flex;
            flex-direction: column;
        }

        .digit-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .digit-value {
            font-size: 4.8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            font-family: 'JetBrains Mono', monospace;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .digit-value.pop {
            animation: rankPop 0.3s ease;
        }

        @keyframes rankPop {
            0% { transform: scale(0.85); opacity: 0.7; }
            50% { transform: scale(1.18); opacity: 1; }
            100% { transform: scale(1.0); }
        }

        .confidence-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .confidence-val {
            font-size: 2.1rem;
            font-weight: 700;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }

        .confidence-meter {
            width: 120px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 4px;
            transition: width 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 0 10px var(--primary);
        }

        .audio-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .audio-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* 10-Class Live Class Badges Matrix */
        .live-matrix-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .live-matrix-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
        }

        .matrix-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.15s ease;
        }

        .matrix-digit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .matrix-bar-mini {
            width: 80%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .matrix-fill-mini {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.12s ease;
        }

        .matrix-pill.active {
            background: rgba(0, 242, 254, 0.18);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .matrix-pill.active .matrix-digit {
            color: #fff;
            font-size: 0.95rem;
        }

        .matrix-pill.active .matrix-fill-mini {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
        }

        /* 28x28 Preprocessing Box */
        .preview-section {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 10px 14px;
        }

        .preview-canvas-box {
            position: relative;
            width: 52px;
            height: 52px;
            border: 2px solid var(--primary);
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        #previewCanvas {
            width: 52px;
            height: 52px;
            image-rendering: pixelated;
        }

        .preview-info h4 {
            font-size: 0.88rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .preview-info p {
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Custom Probability Card matching Dark Theme */
        .prob-card-custom {
            background: rgba(18, 22, 41, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }

        .prob-grid-custom {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prob-row-custom {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 12px;
            transition: all 0.2s ease;
        }

        .prob-digit-custom {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #38bdf8;
            width: 22px;
            text-align: center;
        }

        .prob-track-custom {
            flex: 1;
            height: 24px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .prob-fill-custom {
            height: 100%;
            width: 0%;
            background: #4ab558;
            border-radius: 5px;
            transition: width 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 0 10px rgba(74, 181, 88, 0.3);
        }

        .prob-row.top {
            transform: scale(1.02);
        }

        .prob-row.top .prob-digit {
            color: #00f2fe;
            font-size: 1.15rem;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.8);
        }

        .prob-row.top .prob-bar-fill {
            background: linear-gradient(90deg, #00f2fe, #4facfe, #9d4edd);
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.7);
        }

        .prob-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            width: 55px;
            text-align: right;
            color: var(--text-muted);
            transition: color 0.15s ease, font-weight 0.15s ease;
        }

        .prob-row.top .prob-pct {
            color: #00f2fe;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }


        /* History Strip */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 2px;
        }

        .history-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .history-item {
            flex: 0 0 auto;
            width: 44px;
            height: 56px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;

            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;

        }

        #fileInput {
            display: none;
        }

        @media (max-width: 600px) {
            .app-wrapper {
                padding: 12px;
            }

            header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;

            .instruction-banner {

            #canvas {
                width: 280px !important;
                height: 280px !important;
            }

            .preset-buttons {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Background Interactive Particle Canvas -->
    <canvas id="bgCanvas"></canvas>

    <div class="app-wrapper">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div class="brand-title">
                    <h1>Handwritten Number Classifier</h1>
                    <p>PyTorch Deep Learning & Real-time Vision Engine</p>
                </div>
            </div>

            <div class="header-badges">
                <div class="badge badge-status" id="apiStatusBadge">

                </div>

                </div>
            </div>
        </header>

        <!-- Main Studio Grid -->
        <div class="main-grid">
            
            <!-- Left: Drawing Studio -->
            <div class="glass-card">
                <div class="studio-container">
                    <div class="canvas-header-title" style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px;">

                        <span class="hint-pill" style="font-size: 0.8rem; padding: 3px 10px;"><i class="fa-solid fa-computer-mouse" style="color:var(--primary);"></i> <strong>Left Click:</strong> Draw</span>
                        <span class="hint-pill" style="font-size: 0.8rem; padding: 3px 10px;"><i class="fa-solid fa-eraser" style="color:var(--secondary);"></i> <strong>Right Click:</strong> Erase</span>
                    </div>

                    <div class="canvas-frame" id="canvasFrame">
                        <canvas id="canvas" width="320" height="320"></canvas>

                    </div>
                    <button class="btn-reset" id="resetBtn">Reset</button>

                    <!-- Single Inline Controls Row -->
                    <div class="tools-bar" style="display: flex; align-items: center; justify-content: space-between; width: 320px; gap: 6px; margin-top: 10px; flex-wrap: nowrap;">
                        <div class="brush-controls" style="padding: 4px 8px; font-size: 0.78rem; gap: 6px;">
                            <i class="fa-solid fa-paint-brush"></i>
                            <input type="range" id="brushSlider" class="brush-slider" min="12" max="36" value="22" style="width: 50px;">
                            <span id="brushSizeVal" style="font-family:'JetBrains Mono'; color:#fff; font-size: 0.75rem;">22px</span>
                        </div>

                            <i class="fa-solid fa-upload"></i> Upload

                    <!-- Live Streaming Option -->
                    <div style="display: flex; gap: 12px; align-items: center; margin-top: 10px;">

                                <input type="checkbox" id="autoPredictToggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Right: AI Analytics & Visualizer -->
            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-chart-simple"></i>
                        <span>Live 10-Class Neural Spectrum</span>
                    </div>
                </div>

                <div class="analytics-container">
                    
                    <!-- Spotlight Result Card -->
                    <div class="spotlight-card">
                        <div class="digit-display">
                            <span class="digit-label">TOP PREDICTION</span>
                            <span class="digit-value" id="spotlightDigit">-</span>
                            <span id="modelEngineLabel" style="font-size: 0.72rem; color: var(--text-muted); font-weight: 500; margin-top: 4px;">PyTorch Neural Model</span>
                        </div>

                        <div class="confidence-box">
                            <span class="digit-label">CONFIDENCE</span>
                            <span class="confidence-val" id="spotlightConf">0%</span>
                            <div class="confidence-meter">
                                <div class="confidence-fill" id="spotlightMeter"></div>
                            </div>
                            <button class="audio-btn" id="audioBtn" title="Speak Prediction">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Probability Bar Card (Matching Screenshot) -->
                    <div class="prob-card-custom">
                        <div class="prob-grid-custom" id="probGrid">
                            <!-- JS populated rows for 0-9 -->
                        </div>
                    </div>







                </div>
            </div>

        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <script>
        // ==========================================
        // 1. DYNAMIC BACKGROUND NEURAL PARTICLES
        // ==========================================
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        let particles = [];
        let floatingDigits = [];
        const mouse = { x: null, y: null, radius: 150 };

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            initBgElements();
        }
        window.addEventListener('resize', resizeBgCanvas);

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? 'rgba(0, 242, 254, ' : 'rgba(157, 78, 221, ';
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            }

            draw() {
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = this.color + this.alpha + ')';
                bgCtx.fill();
            }
        }

        class FloatingDigit {
            constructor() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.digit = Math.floor(Math.random() * 10);
                this.fontSize = Math.floor(Math.random() * 24) + 16;
                this.vy = - (Math.random() * 0.4 + 0.1);
                this.alpha = Math.random() * 0.25 + 0.08;
                this.color = Math.random() > 0.5 ? 'rgba(0, 242, 254, ' : 'rgba(157, 78, 221, ';
            }

            update() {
                this.y += this.vy;
                if (this.y < -30) {
                    this.y = bgCanvas.height + 30;
                    this.x = Math.random() * bgCanvas.width;
                }
            }

            draw() {
                bgCtx.font = `700 ${this.fontSize}px 'JetBrains Mono', monospace`;
                bgCtx.fillStyle = this.color + this.alpha + ')';
                bgCtx.fillText(this.digit, this.x, this.y);
            }
        }

        function initBgElements() {
            particles = [];
            floatingDigits = [];
            const particleCount = Math.floor((bgCanvas.width * bgCanvas.height) / 14000);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            for (let i = 0; i < 25; i++) {
                floatingDigits.push(new FloatingDigit());
            }
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            floatingDigits.forEach(d => {
                d.update();
                d.draw();
            });

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 110) {
                        bgCtx.beginPath();
                        bgCtx.strokeStyle = `rgba(0, 242, 254, ${0.15 * (1 - dist / 110)})`;
                        bgCtx.lineWidth = 0.8;
                        bgCtx.moveTo(particles[i].x, particles[i].y);
                        bgCtx.lineTo(particles[j].x, particles[j].y);
                        bgCtx.stroke();
                    }
                }

                if (mouse.x !== null) {
                    const mdx = particles[i].x - mouse.x;
                    const mdy = particles[i].y - mouse.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist < mouse.radius) {
                        bgCtx.beginPath();
                        bgCtx.strokeStyle = `rgba(157, 78, 221, ${0.3 * (1 - mdist / mouse.radius)})`;
                        bgCtx.lineWidth = 1.2;
                        bgCtx.moveTo(particles[i].x, particles[i].y);
                        bgCtx.lineTo(mouse.x, mouse.y);
                        bgCtx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateBg);
        }

        resizeBgCanvas();
        animateBg();


        // ==========================================
        // 2. CANVAS STUDIO & REAL-TIME DRAWING STREAM ENGINE
        // ==========================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas') || document.createElement('canvas');
        previewCanvas.width = 28;
        previewCanvas.height = 28;
        const previewCtx = previewCanvas.getContext('2d');
        const canvasCursor = document.getElementById('canvasCursor');

        let isDrawing = false;
        let currentTool = 'draw';
        let isPaperTheme = false;
        let brushSize = 22;

        let canvasBgColor = '#000000';
        let strokeColor = '#ffffff';

        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 20;

        const GRID_SIZE = 28;
        let pixelGrid = Array.from({ length: GRID_SIZE }, () => new Float32Array(GRID_SIZE));

        function renderPixelGrid() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const cellW = canvas.width / GRID_SIZE;
            const cellH = canvas.height / GRID_SIZE;

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const v = pixelGrid[y][x];
                    if (v > 0) {
                        const g = Math.round(v * 255);
                        ctx.fillStyle = `rgb(${g},${g},${g})`;
                        ctx.fillRect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5);
                    }
                }
            }
        }

        function initMainCanvas() {
            for (let y = 0; y < GRID_SIZE; y++) {
                pixelGrid[y].fill(0);
            }
            renderPixelGrid();
            undoStack = [];
            redoStack = [];
            saveCanvasState();
            updatePreview();
        }

        function saveCanvasState() {
            if (undoStack.length >= MAX_HISTORY) undoStack.shift();
            const gridCopy = pixelGrid.map(row => new Float32Array(row));
            undoStack.push(gridCopy);
            redoStack = [];
        }

        function restoreState(gridCopy) {
            pixelGrid = gridCopy.map(row => new Float32Array(row));
            renderPixelGrid();
            updatePreview();
            if (document.getElementById('autoPredictToggle').checked) {
                triggerLiveStreamPrediction();
            }
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        let lastPos = null;

        function paintGridAt(cx, cy, isErase = false) {
            const cellW = canvas.width / GRID_SIZE;
            const cellH = canvas.height / GRID_SIZE;
            const gx = (cx / cellW) - 0.5;
            const gy = (cy / cellH) - 0.5;

            // Wider, softer falloff radius
            const radius = Math.max(1.2, (brushSize / 22) * 2.0);

            const minX = Math.max(0, Math.floor(gx - radius));
            const maxX = Math.min(GRID_SIZE - 1, Math.ceil(gx + radius));
            const minY = Math.max(0, Math.floor(gy - radius));
            const maxY = Math.min(GRID_SIZE - 1, Math.ceil(gy + radius));

            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    const dist = Math.hypot(x - gx, y - gy);
                    if (dist <= radius) {
                        // Smooth light falloff curve
                        const factor = Math.pow(Math.cos((dist / radius) * (Math.PI / 2)), 1.5);
                        if (isErase) {
                            pixelGrid[y][x] = Math.max(0, pixelGrid[y][x] - factor * 0.5);
                        } else {
                            // Light brush increment per pass
                            pixelGrid[y][x] = Math.min(1.0, pixelGrid[y][x] + factor * 0.22);
                        }
                    }
                }
            }
            renderPixelGrid();
        }

        function strokeLine(p1, p2, isErase = false) {
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            const steps = Math.max(1, Math.ceil(dist / 6));
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = p1.x + (p2.x - p1.x) * t;
                const y = p1.y + (p2.y - p1.y) * t;
                paintGridAt(x, y, isErase);
            }
        }

        function startDrawing(e) {
            const isRightClick = (e.button === 2);
            if (isRightClick) e.preventDefault();

            isDrawing = true;
            const pos = getCanvasCoords(e);
            lastPos = pos;

            const isErasing = (currentTool === 'erase' || isRightClick);
            paintGridAt(pos.x, pos.y, isErasing);
        }

        function draw(e) {
            if (!isDrawing) return;
            const isRightClick = (e.buttons === 2 || currentTool === 'erase');
            if (e.buttons === 2) e.preventDefault();

            const pos = getCanvasCoords(e);
            const isErasing = (currentTool === 'erase' || isRightClick);

            if (lastPos) {
                strokeLine(lastPos, pos, isErasing);
            } else {
                paintGridAt(pos.x, pos.y, isErasing);
            }
            lastPos = pos;

            updatePreview();

            if (document.getElementById('autoPredictToggle').checked) {
                triggerLiveStreamPrediction();
            }
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                lastPos = null;
                saveCanvasState();
                if (document.getElementById('autoPredictToggle').checked) {
                    triggerPrediction(true);
                }
            }
        }


        // Cursor tracking
        function updateCursorPos(e) {
            const frameEl = document.getElementById('canvasFrame');
            if (!frameEl || !canvasCursor) return;
            const frameRect = frameEl.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - frameRect.left;
            const y = clientY - frameRect.top;

            if (x >= 0 && x <= frameRect.width && y >= 0 && y <= frameRect.height) {
                canvasCursor.style.display = 'block';
                canvasCursor.style.left = x + 'px';
                canvasCursor.style.top = y + 'px';
                const diam = Math.max(16, brushSize * (frameRect.width / canvas.width));
                canvasCursor.style.width = diam + 'px';
                canvasCursor.style.height = diam + 'px';
            } else {
                canvasCursor.style.display = 'none';
            }
        }

        const frameEl = document.getElementById('canvasFrame');
        if (frameEl) {
            frameEl.addEventListener('mousemove', updateCursorPos);
            frameEl.addEventListener('mouseleave', () => { if (canvasCursor) canvasCursor.style.display = 'none'; });
            frameEl.addEventListener('touchmove', updateCursorPos);
            frameEl.addEventListener('touchend', () => { if (canvasCursor) canvasCursor.style.display = 'none'; });
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch Events
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDrawing(); });

        // Reset Button
        const resetBtn = document.getElementById('resetBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                initMainCanvas();
                resetResults();
            });
        }

        // Tool Controls
        const drawBtn = document.getElementById('drawBtn');
        const eraseBtn = document.getElementById('eraseBtn');
        const brushSlider = document.getElementById('brushSlider');
        const brushSizeVal = document.getElementById('brushSizeVal');

        if (drawBtn) {
            drawBtn.addEventListener('click', () => {
                currentTool = 'draw';
                drawBtn.classList.add('active');
                if (eraseBtn) eraseBtn.classList.remove('active');
            });
        }

        if (eraseBtn) {
            eraseBtn.addEventListener('click', () => {
                currentTool = 'erase';
                eraseBtn.classList.add('active');
                if (drawBtn) drawBtn.classList.remove('active');
            });
        }

        if (brushSlider && brushSizeVal) {
            brushSlider.addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                brushSizeVal.textContent = brushSize + 'px';
            });
        }

        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                initMainCanvas();
                resetResults();
            });
        }

        const undoBtn = document.getElementById('undoBtn');
        if (undoBtn) {
            undoBtn.addEventListener('click', () => {
                if (undoStack.length > 1) {
                    redoStack.push(undoStack.pop());
                    const prevState = undoStack[undoStack.length - 1];
                    restoreState(prevState);
                }
            });
        }

        const redoBtn = document.getElementById('redoBtn');
        if (redoBtn) {
            redoBtn.addEventListener('click', () => {
                if (redoStack.length > 0) {
                    const nextState = redoStack.pop();
                    undoStack.push(nextState);
                    restoreState(nextState);
                }
            });
        }

        // Upload Image
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const img = new Image();
                    img.onload = () => {
                        const tempC = document.createElement('canvas');
                        tempC.width = canvas.width;
                        tempC.height = canvas.height;
                        const tCtx = tempC.getContext('2d');
                        tCtx.fillStyle = '#000000';
                        tCtx.fillRect(0, 0, tempC.width, tempC.height);

                        const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.8;
                        const x = (canvas.width - img.width * scale) / 2;
                        const y = (canvas.height - img.height * scale) / 2;
                        tCtx.drawImage(img, x, y, img.width * scale, img.height * scale);

                        const cellW = tempC.width / GRID_SIZE;
                        const cellH = tempC.height / GRID_SIZE;
                        const imgData = tCtx.getImageData(0, 0, tempC.width, tempC.height).data;

                        for (let ly = 0; ly < GRID_SIZE; ly++) {
                            for (let lx = 0; lx < GRID_SIZE; lx++) {
                                const startX = Math.floor(lx * cellW);
                                const startY = Math.floor(ly * cellH);
                                let sum = 0, count = 0;
                                for (let py = startY; py < startY + cellH; py++) {
                                    for (let px = startX; px < startX + cellW; px++) {
                                        const idx = (py * tempC.width + px) * 4;
                                        sum += imgData[idx];
                                        count++;
                                    }
                                }
                                pixelGrid[ly][lx] = Math.min(1.0, (sum / count) / 255);
                            }
                        }

                        renderPixelGrid();
                        saveCanvasState();
                        updatePreview();
                        triggerPrediction();
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 28x28 Preprocessing Visualizer with Centering
        function updatePreview() {
            previewCtx.fillStyle = '#000000';
            previewCtx.fillRect(0, 0, 28, 28);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const isWhiteBg = (canvasBgColor === '#ffffff');

            let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
            let found = false;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const idx = (y * canvas.width + x) * 4;
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                    
                    const isStroke = isWhiteBg ? (r < 200 || g < 200 || b < 200) : (r > 30 || g > 30 || b > 30);
                    if (isStroke) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        found = true;
                    }
                }
            }

            if (found) {
                const pad = 15;
                minX = Math.max(0, minX - pad);
                minY = Math.max(0, minY - pad);
                maxX = Math.min(canvas.width, maxX + pad);
                maxY = Math.min(canvas.height, maxY + pad);

                const cropWidth = maxX - minX;
                const cropHeight = maxY - minY;

                let drawW = 20, drawH = 20;
                if (cropWidth > cropHeight) {
                    drawH = Math.max(1, Math.round(20 * (cropHeight / cropWidth)));
                } else {
                    drawW = Math.max(1, Math.round(20 * (cropWidth / cropHeight)));
                }

                const dx = Math.round((28 - drawW) / 2);
                const dy = Math.round((28 - drawH) / 2);

                const tempC = document.createElement('canvas');
                tempC.width = cropWidth;
                tempC.height = cropHeight;
                const tCtx = tempC.getContext('2d');
                tCtx.drawImage(canvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

                if (isWhiteBg) {
                    const cData = tCtx.getImageData(0, 0, cropWidth, cropHeight);
                    for (let i = 0; i < cData.data.length; i += 4) {
                        const gray = 255 - ((cData.data[i] + cData.data[i+1] + cData.data[i+2]) / 3);
                        cData.data[i] = gray;
                        cData.data[i+1] = gray;
                        cData.data[i+2] = gray;
                    }
                    tCtx.putImageData(cData, 0, 0);
                }

                previewCtx.drawImage(tempC, 0, 0, cropWidth, cropHeight, dx, dy, drawW, drawH);
            } else {
                previewCtx.drawImage(canvas, 0, 0, 28, 28);
            }
        }


        // ==========================================
        // 3. SAMPLE PRESETS DRAWING GENERATOR
        // ==========================================
        function loadSample(digit) {
            const tempC = document.createElement('canvas');
            tempC.width = canvas.width;
            tempC.height = canvas.height;
            const tCtx = tempC.getContext('2d');

            tCtx.fillStyle = '#000000';
            tCtx.fillRect(0, 0, tempC.width, tempC.height);
            tCtx.strokeStyle = '#ffffff';
            tCtx.lineWidth = 24;
            tCtx.lineCap = 'round';
            tCtx.lineJoin = 'round';
            tCtx.shadowColor = '#ffffff';
            tCtx.shadowBlur = 8;

            const cx = tempC.width / 2;
            const cy = tempC.height / 2;

            tCtx.beginPath();
            switch (digit) {
                case 0:
                    tCtx.ellipse(cx, cy, 55, 85, 0, 0, Math.PI * 2);
                    break;
                case 1:
                    tCtx.moveTo(cx - 15, cy - 75);
                    tCtx.lineTo(cx, cy - 85);
                    tCtx.lineTo(cx, cy + 85);
                    break;
                case 2:
                    tCtx.arc(cx, cy - 40, 45, Math.PI * 0.9, Math.PI * 2.1);
                    tCtx.lineTo(cx - 45, cy + 75);
                    tCtx.lineTo(cx + 50, cy + 75);
                    break;
                case 3:
                    tCtx.arc(cx - 5, cy - 35, 42, Math.PI * 1.2, Math.PI * 0.4);
                    tCtx.arc(cx - 5, cy + 35, 42, Math.PI * 1.6, Math.PI * 0.8);
                    break;
                case 4:
                    tCtx.moveTo(cx + 25, cy + 75);
                    tCtx.lineTo(cx + 25, cy - 75);
                    tCtx.lineTo(cx - 50, cy + 15);
                    tCtx.lineTo(cx + 60, cy + 15);
                    break;
                case 5:
                    tCtx.moveTo(cx + 45, cy - 75);
                    tCtx.lineTo(cx - 35, cy - 75);
                    tCtx.lineTo(cx - 40, cy - 10);
                    tCtx.arc(cx - 5, cy + 30, 45, Math.PI * 1.3, Math.PI * 0.7);
                    break;
                case 6:
                    tCtx.arc(cx, cy + 30, 45, 0, Math.PI * 2);
                    tCtx.moveTo(cx + 35, cy + 10);
                    tCtx.lineTo(cx - 15, cy - 75);
                    break;
                case 7:
                    tCtx.moveTo(cx - 55, cy - 75);
                    tCtx.lineTo(cx + 55, cy - 75);
                    tCtx.lineTo(cx - 25, cy + 75);
                    break;
                case 8:
                    tCtx.arc(cx, cy - 35, 38, 0, Math.PI * 2);
                    tCtx.arc(cx, cy + 35, 45, 0, Math.PI * 2);
                    break;
                case 9:
                    tCtx.arc(cx, cy - 25, 45, 0, Math.PI * 2);
                    tCtx.moveTo(cx + 40, cy - 25);
                    tCtx.lineTo(cx + 15, cy + 75);
                    break;
            }
            tCtx.stroke();

            const cellW = tempC.width / GRID_SIZE;
            const cellH = tempC.height / GRID_SIZE;
            const imgData = tCtx.getImageData(0, 0, tempC.width, tempC.height).data;

            for (let ly = 0; ly < GRID_SIZE; ly++) {
                for (let lx = 0; lx < GRID_SIZE; lx++) {
                    const startX = Math.floor(lx * cellW);
                    const startY = Math.floor(ly * cellH);
                    let sum = 0, count = 0;
                    for (let py = startY; py < startY + cellH; py++) {
                        for (let px = startX; px < startX + cellW; px++) {
                            const idx = (py * tempC.width + px) * 4;
                            sum += imgData[idx];
                            count++;
                        }
                    }
                    pixelGrid[ly][lx] = Math.min(1.0, (sum / count) / 255);
                }
            }

            renderPixelGrid();
            saveCanvasState();
            updatePreview();
            triggerPrediction();
        }


        // ==========================================
        // 4. PROBABILITY BARS & LIVE 10-CLASS RADAR MATRIX
        // ==========================================
        const probGrid = document.getElementById('probGrid');
        const matrixGrid = document.getElementById('matrixGrid');

        function initUIContainers() {
            if (probGrid) {
                probGrid.innerHTML = '';
                for (let i = 0; i < 10; i++) {
                    const row = document.createElement('div');
                    row.className = 'prob-row-custom';
                    row.id = `prob-row-${i}`;
                    row.innerHTML = `
                        <span class="prob-digit-custom">${i}</span>
                        <div class="prob-track-custom">
                            <div class="prob-fill-custom" id="prob-fill-${i}"></div>
                        </div>
                    `;
                    probGrid.appendChild(row);
                }
            }
        }
        initUIContainers();

        // ==========================================
        // 5. PYTORCH FASTAPI BACKEND INFERENCE ENGINE
        // ==========================================
        const API_URL = 'https://digit-recognition-ilg5.onrender.com';
        let isBackendOnline = false;
        let isApiFetchPending = false;
        let animationFrameId = null;

        let offlineConsecutiveCount = 0;

        async function checkBackendStatus() {
            const badge = document.getElementById('apiStatusBadge');
            const statusText = document.getElementById('apiStatusText');
            try {
                const res = await fetch(`${API_URL}/`, { method: 'GET', signal: AbortSignal.timeout(6000) });
                if (res.ok) {
                    offlineConsecutiveCount = 0;
                    isBackendOnline = true;
                    if (badge) badge.className = 'badge badge-status';
                    if (statusText) statusText.textContent = 'PyTorch API Online';
                    const label = document.getElementById('modelEngineLabel');
                    if (label) label.textContent = '⚡ PyTorch Neural Model (Python)';
                    return;
                }
            } catch (e) {
                // Network timeout or error
            }
            
            offlineConsecutiveCount++;
            // Only mark offline if 2 consecutive checks fail to prevent blips on Render
            if (offlineConsecutiveCount >= 2) {
                isBackendOnline = false;
                if (badge) badge.className = 'badge badge-status offline';
                if (statusText) statusText.textContent = 'PyTorch Offline';
                const label = document.getElementById('modelEngineLabel');
                if (label) label.textContent = '⚠️ PyTorch Backend Disconnected';
            }
        }
        checkBackendStatus();
        setInterval(checkBackendStatus, 10000);

        function triggerLiveStreamPrediction() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => {
                triggerPrediction();
            });
        }

        document.getElementById('predictBtn').addEventListener('click', () => triggerPrediction(true));

        async function triggerPrediction(animatePop = false) {
            const base64Image = canvas.toDataURL('image/png');

            if (!isApiFetchPending) {
                isApiFetchPending = true;
                try {
                    const res = await fetch(`${API_URL}/predict`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Image })
                    });
                    isApiFetchPending = false;
                    if (res.ok) {
                        const data = await res.json();
                        const label = document.getElementById('modelEngineLabel');
                        if (label) label.textContent = '⚡ PyTorch Neural Model (Python)';
                        displayResults(data.prediction, data.confidence, data.probabilities, animatePop);
                        return;
                    }
                } catch (err) {
                    isApiFetchPending = false;
                    const label = document.getElementById('modelEngineLabel');
                    if (label) label.textContent = '⚠️ PyTorch Server Offline (Start app.py on port 8000)';
                }
            }
        }

        // Live Animated Results Display for All 10 Classes
        let currentTopDigit = null;
        let lastAnnouncedDigit = null;

        function displayResults(digit, confidence, probabilities, animatePop = false) {
            const digitEl = document.getElementById('spotlightDigit');
            
            if (digitEl) {
                if (animatePop && currentTopDigit !== digit) {
                    currentTopDigit = digit;
                    digitEl.classList.remove('pop');
                    void digitEl.offsetWidth; // Trigger reflow
                    digitEl.classList.add('pop');
                } else {
                    currentTopDigit = digit;
                }
                digitEl.textContent = digit;
            }

            const confPctStr = (confidence * 100).toFixed(1) + '%';
            const spotConf = document.getElementById('spotlightConf');
            const spotMeter = document.getElementById('spotlightMeter');
            if (spotConf) spotConf.textContent = confPctStr;
            if (spotMeter) spotMeter.style.width = confPctStr;

            // Live Update for all 10 classes simultaneously
            for (let i = 0; i < 10; i++) {
                const row = document.getElementById(`prob-row-${i}`);
                const fill = document.getElementById(`prob-fill-${i}`);
                const pct = document.getElementById(`prob-pct-${i}`);
                const pill = document.getElementById(`matrix-pill-${i}`);
                const mFill = document.getElementById(`matrix-fill-${i}`);

                const val = probabilities ? probabilities[i] : (i === digit ? confidence : 0.02);
                const pctVal = (val * 100).toFixed(1) + '%';

                if (fill) fill.style.width = pctVal;
                if (mFill) mFill.style.width = pctVal;
                if (pct) pct.textContent = pctVal;

                if (row) {
                    if (i === digit) row.classList.add('top');
                    else row.classList.remove('top');
                }

                if (pill) {
                    if (i === digit) pill.classList.add('active');
                    else pill.classList.remove('active');
                }
            }

            if (!isDrawing && confidence > 0.15 && lastAnnouncedDigit !== digit) {
                addHistoryItem(digit, confidence);
                lastAnnouncedDigit = digit;
            }
        }

        function resetResults() {
            const spotDigit = document.getElementById('spotlightDigit');
            const spotConf = document.getElementById('spotlightConf');
            const spotMeter = document.getElementById('spotlightMeter');
            if (spotDigit) spotDigit.textContent = '-';
            if (spotConf) spotConf.textContent = '0%';
            if (spotMeter) spotMeter.style.width = '0%';

            for (let i = 0; i < 10; i++) {
                const row = document.getElementById(`prob-row-${i}`);
                const pill = document.getElementById(`matrix-pill-${i}`);
                const fill = document.getElementById(`prob-fill-${i}`);
                const mFill = document.getElementById(`matrix-fill-${i}`);
                const pct = document.getElementById(`prob-pct-${i}`);

                if (fill) fill.style.width = '0%';
                if (mFill) mFill.style.width = '0%';
                if (pct) pct.textContent = '0.0%';
                if (row) row.classList.remove('top');
                if (pill) pill.classList.remove('active');
            }
            currentTopDigit = null;
            lastAnnouncedDigit = null;
        }

        // Speech Synthesizer
        document.getElementById('audioBtn').addEventListener('click', () => {
            const digit = document.getElementById('spotlightDigit').textContent;
            const conf = document.getElementById('spotlightConf').textContent;
            if (digit !== '-') {
                const text = `Predicted Digit ${digit} with ${conf} confidence.`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        });

        // History Gallery Log
        const historyList = document.getElementById('historyList');
        let historyCount = 0;

        function addHistoryItem(digit, confidence) {
            if (!historyList) return;
            if (historyCount === 0) {
                historyList.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            
            const thumbCanvas = document.createElement('canvas');
            thumbCanvas.width = 28;
            thumbCanvas.height = 28;
            thumbCanvas.className = 'history-thumb';
            const tCtx = thumbCanvas.getContext('2d');
            tCtx.drawImage(canvas, 0, 0, 28, 28);

            item.appendChild(thumbCanvas);

            const valSpan = document.createElement('span');
            valSpan.className = 'history-val';
            valSpan.textContent = digit;
            item.appendChild(valSpan);

            item.title = `Digit ${digit} (${(confidence * 100).toFixed(0)}%)`;

            historyList.insertBefore(item, historyList.firstChild);
            historyCount++;

            if (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        initMainCanvas();
    </script>
